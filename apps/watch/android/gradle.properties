org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Release signing (leave blank for debug-only local builds) ──
# Point these at the SAME keystore your phone app is signed with. If EAS manages
# the phone keystore, export it (eas credentials) and reference it here so both
# APKs share one signing identity. Prefer passing these via ~/.gradle/gradle.properties
# or CI secrets rather than committing them.
# PODCATCH_KEYSTORE_PATH=/absolute/path/to/podcatch.keystore
# PODCATCH_KEYSTORE_PASSWORD=
# PODCATCH_KEY_ALIAS=
# PODCATCH_KEY_PASSWORD=
