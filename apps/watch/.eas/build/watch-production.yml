build:
  name: Build Watch AAB
  steps:
    - eas/checkout
    - eas/inject_android_credentials
    - run:
        name: Fix Groovy syntax in KTS file
        command: |
          GRADLE_FILE=/home/expo/workingdir/build/apps/watch/android/app/build.gradle.kts
          sed -i 's/apply from: "\(.*\)"/apply(from = "\1")/' "$GRADLE_FILE"
    - run:
        name: Build Watch AAB
        command: cd /home/expo/workingdir/build/apps/watch/android && ./gradlew :app:bundleRelease
    - eas/find_and_upload_build_artifacts
